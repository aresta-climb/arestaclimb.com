name: Notificar Atualização nos Termos Legais

on:
  push:
    branches:
      - main
    paths:
      - 'public/docs/termos-de-uso.md'
      - 'public/docs/politica-de-privacidade.md'
      - 'public/docs/termos-de-uso-fixalog.md'
      - 'public/docs/politica-de-privacidade-fixalog.md'
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Token de GitHub App
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Identificar Documentos Alterados
        id: alteracoes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "aresta_app=true" >> "$GITHUB_OUTPUT"
            echo "fixalog=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARQUIVOS=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename')
          echo "Arquivos alterados no push:"
          echo "$ARQUIVOS"

          if echo "$ARQUIVOS" | grep -Eq '^public/docs/(termos-de-uso|politica-de-privacidade)\.md$'; then
            echo "aresta_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "aresta_app=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$ARQUIVOS" | grep -Eq '^public/docs/(termos-de-uso-fixalog|politica-de-privacidade-fixalog)\.md$'; then
            echo "fixalog=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixalog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notificar Aresta App
        if: steps.alteracoes.outputs.aresta_app == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: aresta-climb/aresta_app
          event-type: update-legal-terms
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }

      - name: Notificar Fixalog
        if: steps.alteracoes.outputs.fixalog == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: aresta-climb/fixalog
          event-type: update-legal-terms
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }
